# Point a new issue at the existing issues it duplicates.
#
# No repository access at all: the run gets the new issue's text and a list of
# recent candidates, and returns numbers. Cheap and safe on a public repository.
name: Pi Duplicate Detection

on:
  issues:
    types: [opened]

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect recent issues
        id: recent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --repo "${{ github.repository }}" --state all \
            --limit 50 --json number,title,state \
            --jq 'map("\(.number) [\(.state)] \(.title)") | join("\n")' > recent.txt
          {
            echo "list<<PI_EOF"
            cat recent.txt
            echo "PI_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: your-org/pi-agent-action@v1
        with:
          provider: deepseek
          model: deepseek-chat
          api_key: ${{ secrets.DEEPSEEK_API_KEY }}

          allowed_non_write_users: "*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_tools: "true"
          max_turns: "2"

          json_schema: |
            {
              "type": "object",
              "properties": {
                "duplicates": { "type": "array", "items": { "type": "integer" } },
                "reason": { "type": "string" }
              },
              "required": ["duplicates"]
            }

          prompt: |
            New issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
            ${{ github.event.issue.body }}

            Existing issues:
            ${{ steps.recent.outputs.list }}

            Return the numbers of existing OPEN issues that describe the same
            problem or request. Return an empty list when you are unsure.
