# Run the agent on demand with whatever you type.
#
# Useful for "look at this and tell me" requests that never touch an issue.
# Dispatch requires write access, so no untrusted text reaches this job.
name: Pi Ad-hoc Analysis

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should the agent do?"
        required: true
        type: string
      tools:
        description: "Pi tools to allow (comma separated, empty = all)"
        required: false
        type: string
        default: "read,grep,find,ls"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Tioit-Wang/pi-agent-action@v1
        with:
          provider: deepseek
          model: deepseek-chat
          api_key: ${{ secrets.DEEPSEEK_API_KEY }}

          allowed_tools: ${{ inputs.tools }}
          max_turns: "20"

          prompt: |
            ${{ inputs.prompt }}

            The repository is checked out here. Answer in the job summary; do not
            commit anything.
