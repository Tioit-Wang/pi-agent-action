# Respond to @pi mentions in issues, pull requests and review comments.
#
# Copy this file to .github/workflows/pi.yml on your default branch. Comment-only
# triggers only run workflows that exist on the default branch, so a pull request
# cannot add this file and then trigger it.
name: Pi

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  pi:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@pi')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@pi')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@pi')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@pi') || github.event.assignee.login == 'pi'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Tioit-Wang/pi-agent-action@v1
        with:
          provider: deepseek
          model: deepseek-chat
          api_key: ${{ secrets.DEEPSEEK_API_KEY }}
