# After a failing workflow, explain the failure on the PR — or fix it when it is
# mechanical.
#
# `additional_permissions: actions: read` is what installs the github_ci MCP
# server; without it the agent cannot read job logs.
name: Pi CI Failure Triage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The base branch, not the failing ref: this job holds a token.
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - uses: Tioit-Wang/pi-agent-action@v1
        with:
          provider: deepseek
          model: deepseek-chat
          api_key: ${{ secrets.DEEPSEEK_API_KEY }}

          additional_permissions: |
            actions: read

          # Explaining a failure needs no mutation. Remove `bash` from this list
          # (or set no_tools) if the logs may come from a fork.
          allowed_tools: read,grep,find,ls,bash
          max_turns: "25"

          prompt: |
            Workflow run ${{ github.event.workflow_run.id }} failed on branch
            ${{ github.event.workflow_run.head_branch }} in ${{ github.repository }}.

            1. Read the failing job logs through the GitHub CI tools.
            2. Identify the first real error (not the cascade after it).
            3. Decide: is it caused by the change on this branch, or is it flaky
               infrastructure?
            4. Post one comment on the pull request for this branch with the
               cause and the smallest fix. If the fix is a one-line change you
               are confident about, make it and say what you changed.
