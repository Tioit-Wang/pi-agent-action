{labels: {type: {required: true,options: [{name: enhancement,description: A new feature or an improvement},{name: documentation,description: Documentation is missing or wrong},{name: question,description: A usage question},{name: performance,description: Slow,heavy: null,or leaking resources: null},{name: security,description: A vulnerability or a secret exposure}]},priority: {required: true,options: [{name: P0,description: Data loss,crash: null,security: null,or unusable: null},{name: P1,description: Core feature broken,workaround exists: null},{name: P2,description: A defect or rough edge off the main path},{name: P3,description: Suggestion,polish: null,or edge case: null}]},state: {required: false,options: [{name: needs-info,description: Missing steps,environment or version: null}]}},duplicate: {label: duplicate,confidence: 0.8,candidates: 8,include_comments: true,comment: {on_new_issue: "Possibly a duplicate of #{{number}} ({{state}}): {{reason}}\n\nIf this is the same problem, please continue in #{{number}} and close this one.\n",on_original: "Raised again in #{{new_number}} ({{date}}).\n"}}}