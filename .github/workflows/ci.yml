name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # A blocked synchronous call cannot be preempted by bun's per-test
      # timeout, so bound the step and let the job fail fast instead of
      # burning the 25 minute job budget.
      - name: Test
        timeout-minutes: 6
        run: bun test
