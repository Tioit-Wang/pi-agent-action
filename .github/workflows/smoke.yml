# End-to-end check of the one thing only a real run can prove: does the action
# reach the configured provider, and does the event stream parse back?
#
# Manual only. One turn, no tools, no repository writes, no GitHub API calls
# beyond the checkout the action already needs.
name: smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run the base action against the configured provider
        id: pi
        uses: ./base-action
        with:
          provider: deepseek
          model: deepseek-v4.1-flash
          base_url: https://platform.aimom.net/v1
          api_style: openai-completions
          api_key: ${{ secrets.AIMOM_API_KEY }}
          no_tools: "true"
          max_turns: "1"
          json_schema: |
            {"type":"object","properties":{"ok":{"type":"boolean"},"model":{"type":"string"}},"required":["ok"]}
          prompt: |
            Reply with a single JSON object and nothing else:
            {"ok": true, "model": "deepseek-v4.1-flash"}

      - name: Assert the run succeeded
        env:
          CONCLUSION: ${{ steps.pi.outputs.conclusion }}
          STRUCTURED: ${{ steps.pi.outputs.structured_output }}
          SESSION_ID: ${{ steps.pi.outputs.session_id }}
          EXECUTION_FILE: ${{ steps.pi.outputs.execution_file }}
        run: |
          echo "conclusion=${CONCLUSION}"
          echo "session_id=${SESSION_ID}"
          echo "structured_output=${STRUCTURED}"
          echo "event lines: $(wc -l < "${EXECUTION_FILE}" 2>/dev/null || echo missing)"
          if [ "${CONCLUSION}" != "success" ]; then
            echo "::error::the pi run did not report success"
            exit 1
          fi
          case "${STRUCTURED}" in
            *'"ok":true'*|*'"ok": true'*) echo "structured output parsed" ;;
            *) echo "::error::structured_output missing or unexpected"; exit 1 ;;
          esac
